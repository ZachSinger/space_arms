<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Robot Lab - Space Arms Dealer</title>
<style>
  :root { color-scheme: dark; --bg: #0d1322; --panel: #141c2f; --panel2: #192238; --line: #232d45; --text: #d9dfeb; --dim: #7a86a0; --faint: #4d5872; --accent: #5aa9e6; --good: #5fcf8a; --bad: #ef7a85; --warn: #e8b85a; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
  button:hover:not(:disabled) { border-color: var(--faint); }
  button.primary { background: #1d4f78; border-color: #2c6a9c; }
  button.small { padding: 1px 7px; font-size: 12px; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--line); }
  button:disabled { opacity: .35; cursor: default; }
  input, select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: inherit; }
  input:focus, select:focus { border-color: var(--accent); outline: none; }
  input.invalid { border-color: var(--bad); }
  input[type=number] { width: 72px; text-align: right; }
  select option { background: var(--panel); color: var(--text); }
  .dim { color: var(--dim); }

  header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 18px 0 0; font-weight: 600; }
  .clock { font-variant-numeric: tabular-nums; color: var(--dim); margin-left: 4px; min-width: 120px; }
  .spacer { flex: 1; }
  #status { color: var(--dim); white-space: pre-line; font-size: 13px; }
  #status.bad { color: var(--bad); }
  #status.good { color: var(--good); }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 480px; }
  #store { overflow: auto; padding: 16px 20px 30px; }
  #side { overflow: auto; border-left: 1px solid var(--line); padding: 0 16px 30px; }

  /* The store map */
  .map { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 230px); min-height: 360px; }
  .room { position: absolute; top: 0; bottom: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .room-name { position: absolute; top: 8px; left: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .thing { position: absolute; transform: translate(-50%, -50%); }
  .shelf { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 6px 4px; text-align: center; font-size: 11px; color: var(--dim); }
  .shelf .bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-bottom: 3px; }
  .shelf .bar div { height: 100%; background: var(--accent); transition: width .4s; }
  .shelf.low .bar div { background: var(--bad); }
  .counter { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; text-align: center; font-size: 11px; color: var(--dim); padding: 6px 4px; }
  .queue { display: flex; gap: 4px; justify-content: center; }
  .customer { width: 11px; height: 11px; border-radius: 50%; background: var(--warn); opacity: .8; }
  .mess { width: 18px; height: 12px; border-radius: 50%; background: #6b5136; }
  .area { position: absolute; border: 1px dashed var(--line); border-radius: 6px; }
  .area-name { position: absolute; top: 3px; left: 7px; font-size: 11px; color: var(--faint); }
  .crates { position: absolute; inset: 22px 8px 6px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
  .crate { width: 14px; height: 14px; border-radius: 2px; background: #a3845b; }
  .crate.empty { background: none; border: 1px dashed var(--line); }
  .station { width: 40px; height: 40px; border: 1px dashed var(--faint); border-radius: 8px; color: var(--faint); display: grid; place-items: center; font-size: 16px; }
  .bot { position: absolute; transform: translate(-50%, -50%); transition: left .6s ease, top .6s ease, opacity .3s; text-align: center; pointer-events: auto; cursor: pointer; z-index: 2; }
  .bot .body { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #0d1322; box-shadow: 0 0 0 3px var(--bg); }
  .bot .charge { width: 30px; height: 4px; background: var(--bg); border-radius: 2px; margin: 4px auto 0; overflow: hidden; }
  .bot .charge div { height: 100%; background: var(--good); }
  .bot .charge.low div { background: var(--bad); }
  .bot .label { font-size: 11px; color: var(--dim); white-space: nowrap; margin-top: 1px; }
  .bot.off { opacity: .45; }
  .bot.off .body { background: var(--faint) !important; }

  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
  .score { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .score .n { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .score .what { font-size: 12px; color: var(--dim); }
  details.log { margin-top: 14px; }
  details.log summary { color: var(--dim); cursor: pointer; font-size: 13px; }
  .log-lines { font-size: 13px; color: var(--dim); max-height: 240px; overflow: auto; margin-top: 6px; }
  .log-lines span { color: var(--faint); font-variant-numeric: tabular-nums; margin-right: 10px; }

  /* Side panel */
  .tabs { display: flex; gap: 18px; position: sticky; top: 0; background: var(--bg); padding: 12px 0 10px; z-index: 3; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; color: var(--dim); font-weight: 600; padding: 2px 0 4px; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .hint { color: var(--dim); font-size: 13px; margin: 0 0 12px; }
  .robot { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: var(--panel); }
  .robot.problem { border-color: #6b3a44; }
  .robot-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; cursor: pointer; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; }
  .robot-row .name { font-weight: 600; }
  .robot-row .now { font-size: 13px; color: var(--dim); }
  .robot-row .now.bad { color: var(--bad); }
  .mini { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .mini .bar { width: 46px; height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .mini .bar div { height: 100%; background: var(--good); }
  .mini .bar.low div { background: var(--bad); }
  .editor { border-top: 1px solid var(--line); padding: 12px; }
  .build { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .build label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dim); }
  .build input, .build select { width: 100%; }
  .power { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); }
  .power .meter { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .power .meter div { height: 100%; background: var(--accent); }
  .power.over { color: var(--bad); }
  .power.over .meter div { background: var(--bad); }
  .facts { font-size: 12px; color: var(--faint); margin: 4px 0 14px; }
  .section { font-size: 12px; color: var(--dim); margin: 0 0 6px; }
  .slot { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; background: var(--bg); }
  .slot.active { border-color: #2f6b4a; }
  .slot-head { display: flex; gap: 8px; align-items: center; padding: 6px 8px; }
  .slot-head .n { color: var(--faint); font-size: 12px; width: 14px; text-align: right; }
  .slot-head select { flex: 1; min-width: 0; }
  .tools { display: flex; gap: 2px; }
  .tools button { padding: 0 5px; font-size: 11px; background: none; border-color: transparent; color: var(--faint); }
  .tools button:hover:not(:disabled) { color: var(--text); border-color: var(--line); }
  .ability { padding: 0 10px 8px 30px; font-size: 13px; color: var(--dim); }
  .slot.active .ability { color: var(--good); }
  .rules { padding: 0 8px 6px; }
  .rule { display: grid; grid-template-columns: 14px 16px 1fr auto; gap: 6px; align-items: start; padding: 4px 0; border-radius: 5px; }
  .rule + .rule { border-top: 1px solid var(--line); }
  .rule .n, .rule input[type=checkbox], .rule .tools { margin-top: 6px; }
  .rule .n { color: var(--faint); font-size: 12px; text-align: right; }
  .rule .what { display: grid; grid-template-columns: 34px 1fr; gap: 4px 6px; align-items: center; }
  .rule .what .word { font-size: 12px; color: var(--faint); text-align: right; }
  .rule .what select { width: 100%; font-size: 13px; padding: 3px 4px; }
  .rule.off .what { opacity: .4; }
  .rule.chosen .what select { border-color: var(--good); color: var(--good); }
  .rule .tools { opacity: 0; }
  .rule:hover .tools { opacity: 1; }
  .add-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 8px 8px 30px; font-size: 12px; color: var(--faint); }
  .slot.empty { border-style: dashed; background: none; }
  .robot-foot { display: flex; justify-content: flex-end; margin-top: 4px; }

  h3.part-title { font-size: 14px; margin: 22px 0 4px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  h3.part-title:first-of-type { margin-top: 4px; }
  .part-help { color: var(--dim); font-size: 12px; margin: 0 0 8px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 3px 4px; text-align: left; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  .parts-table input[type=number] { width: 58px; }
  .parts-table input.name { width: 100%; }
  .prefab-card { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
  .prefab-card .row { display: grid; grid-template-columns: 1fr 1fr 64px auto; gap: 6px; align-items: center; }
  .prefab-card .row input.name, .prefab-card .row select { width: 100%; }
  .prefab-card .desc { font-size: 12px; color: var(--dim); margin-top: 5px; }
  .costs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .settings { display: grid; gap: 6px; }
  .settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Robot Lab</h1>
  <button id="play" class="primary">Play</button>
  <select id="speed" title="How fast time moves"></select>
  <button id="stepOne" class="ghost" title="Move time forward one second">Step</button>
  <button id="runAll" class="ghost" title="Run the rest of the shift instantly">Skip to end</button>
  <button id="restart" class="ghost">Restart</button>
  <span class="clock" id="clock"></span>
  <span class="spacer"></span>
  <span id="status">Loading...</span>
  <button id="undo" class="ghost" disabled>Undo all</button>
  <button id="save" class="primary" disabled>Save</button>
</header>
<main>
  <div id="store"></div>
  <div id="side"></div>
</main>
<script type="module">
import { CONDITIONS, ACTIONS, PREFAB_ABILITIES, findAbility } from "/js/logic/RobotGambits.js";
import { boardPower, commandPower, findBoard, findCell, findFrame, powerNeeded } from "/js/logic/RobotParts.js";
import { applyBuild, createSim, step, SIM_RULES } from "/scripts/robot-lab/sim.js";

const $ = (selector) => document.querySelector(selector);
const escape = (text) => String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clone = (value) => JSON.parse(JSON.stringify(value));
const money = (value) => Math.round(value).toLocaleString("en-US");
const clock = (seconds) => `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
const ACTION_WORDS = { work_register: "Working a register", restock: "Restocking a shelf", unload_pad: "Carrying a crate in", clean: "Cleaning a mess", charge: "Charging", wait: "Waiting" };
const COLORS = ["#5aa9e6", "#f2a65a", "#b48ef0", "#5fcf8a", "#ef7a85", "#e6d35a", "#6fd6d0", "#d98ad6"];
const colorOf = (index) => COLORS[index % COLORS.length];
const SETTINGS = [
  ["shiftSeconds", "Shift length (seconds)"], ["customersPerMinute", "Customers per minute"],
  ["registers", "Registers"], ["shelves", "Shelves"], ["stations", "Charging stations"],
  ["backroomCapacity", "Backroom holds (crates)"], ["startingBackroomCrates", "Crates in backroom at start"],
  ["deliveryEverySeconds", "Delivery every (seconds)"], ["cratesPerDelivery", "Crates per delivery"],
  ["standardDrain", "Standard drain (charge used per working second)"],
];
const WHY = { "nothing to do": "Skipped: nothing for this board to do right now", off: "Switched off", "condition false": "Skipped: the \"if\" part isn't true", "can't do it right now": "Skipped: the \"if\" is true, but the job can't be done right now", chosen: "Doing this now" };
// Each part list's columns: [field, heading, smallest allowed, whole numbers only, hover help].
const PART_COLUMNS = {
  frames: [["power", "Power", 0, false, "How much of the cell's capacity the frame itself uses."], ["boardSlots", "Slots", 1, true, "How many logic boards fit. Slot 1 is checked first."], ["speed", "Speed", 0.1, false, "1 is normal. 2 does every job in half the time."]],
  cells: [["capacity", "Capacity", 0, false, "The most power the frame and boards may need in total. Never runs down."], ["charge", "Charge", 1, false, "The fuel tank. Runs down as the robot works."], ["drainRate", "Drain", 0, false, "Multiplies the standard drain. 1.5 runs down one and a half times as fast."], ["chargeRate", "Refill", 0.1, false, "Charge regained per second on a charging station."]],
  custom: [["power", "Power", 0, false, "Power the board needs before any commands are written on it."], ["commands", "Commands", 1, true, "How many commands you can write on it."]],
};
const NEW_PART = {
  frames: () => ({ name: "New frame", power: 5, boardSlots: 1, speed: 1 }),
  cells: () => ({ name: "New power cell", capacity: 12, charge: 240, drainRate: 1, chargeRate: 4 }),
  prefab: () => ({ name: "New prefab board", kind: "prefab", power: 2, ability: PREFAB_ABILITIES[0].id }),
  custom: () => ({ name: "New custom board", kind: "custom", power: 2, commands: 3 }),
};

let saved = null;
let setup = null;
let sim = null;
let timer = null;
let speed = 5;
let tab = "robots";
let openRobot = 0;

const dirty = () => JSON.stringify(setup) !== JSON.stringify(saved);
function status(text, kind = "") {
  $("#status").textContent = text;
  $("#status").className = kind;
}
function updateButtons() {
  $("#save").disabled = !dirty() || document.querySelector("input.invalid") !== null;
  $("#undo").disabled = !dirty();
}

function options(list, selected) {
  return list.map((entry) => `<option value="${entry.id}" ${entry.id === selected ? "selected" : ""}>${escape(entry.label)}</option>`).join("");
}

// What the robot is checking right now, keyed "board slot:command number".
function checksFor(live) {
  const results = new Map();
  for (const check of live?.choice?.checks ?? []) {
    const entry = live.program[check.index];
    if (entry) results.set(`${entry.slot}:${entry.command}`, check.result);
  }
  return results;
}

/** What a robot is up to, in a few words, and whether that's a problem. */
function activity(live) {
  if (!live) return { text: "Not started", bad: false };
  if (live.noPower) return { text: "Won't switch on: not enough power", bad: true };
  if (live.outOfPower) return { text: "Ran out of charge", bad: true };
  if (sim.time >= sim.settings.shiftSeconds) return { text: "Shift over", bad: false };
  const action = live.task?.action ?? live.lastAction;
  if (!action) return { text: "Starting up", bad: false };
  return { text: ACTION_WORDS[action], bad: false };
}

// ---------- The store map ----------

// Where things sit on the map, as percentages of its width and height.
const SALES = { left: 0, width: 63 };
const BACK = { left: 65, width: 35 };
function spread(count, from, to, index) {
  const gap = (to - from) / count;
  return from + gap * (index + 0.5);
}
function layout() {
  const shelves = sim.shelves.length;
  const columns = Math.min(shelves, 6);
  const rows = Math.ceil(shelves / columns);
  return {
    shelf: (i) => ({ x: spread(columns, 4, 59, i % columns), y: 20 + Math.floor(i / columns) * (34 / rows) }),
    register: (i) => ({ x: spread(sim.registers.length, 6, 57, i), y: 80 }),
    mess: (i) => ({ x: 9 + ((i * 0.618034) % 1) * 48, y: 46 + ((i * 0.754878) % 1) * 20 }),
    pad: { x: BACK.left + BACK.width / 2, y: 18 },
    storage: { x: BACK.left + BACK.width / 2, y: 48 },
    station: (i) => ({ x: spread(sim.stations.length, BACK.left + 3, 97, i), y: 86 }),
    waiting: { x: BACK.left + 6, y: 70 },
  };
}

function robotSpot(live, index, place, counters) {
  const task = live.task;
  const seat = (key, base, dx = 7) => {
    const n = counters[key] = (counters[key] ?? -1) + 1;
    return { x: base.x + n * dx, y: base.y };
  };
  if (!task || live.noPower || live.outOfPower) return seat("waiting", place.waiting);
  if (task.action === "work_register") {
    const p = place.register(sim.registers.indexOf(task.register));
    return seat(`r${task.register.id}`, { x: p.x, y: p.y - 10 });
  }
  if (task.action === "restock") {
    const p = place.shelf(sim.shelves.indexOf(task.shelf));
    return seat(`s${task.shelf.id}`, { x: p.x, y: p.y + 11 });
  }
  if (task.action === "unload_pad") return seat("pad", { x: place.pad.x, y: place.pad.y + 13 });
  if (task.action === "clean") {
    const n = counters.clean = (counters.clean ?? -1) + 1;
    const p = place.mess(n);
    return { x: p.x + 3, y: p.y - 5 };
  }
  if (task.action === "charge") {
    const p = place.station(sim.stations.indexOf(task.station));
    return { x: p.x, y: p.y - 2 };
  }
  return seat("waiting", place.waiting);
}

function renderMap() {
  const place = layout();
  const at = ({ x, y }) => `left:${x}%;top:${y}%`;
  const shelves = sim.shelves.map((shelf, i) => {
    const fill = shelf.stock / SIM_RULES.shelfCapacity;
    return `<div class="thing shelf ${fill < 0.25 ? "low" : ""}" style="${at(place.shelf(i))};width:${Math.min(13, 46 / Math.min(sim.shelves.length, 6))}%" title="${shelf.id}: ${shelf.stock} of ${SIM_RULES.shelfCapacity} items">
      <div class="bar"><div style="width:${fill * 100}%"></div></div>Shelf ${i + 1}</div>`;
  }).join("");
  const registers = sim.registers.map((register, i) => {
    const p = place.register(i);
    return `<div class="thing counter" style="${at(p)};width:${Math.min(16, 40 / sim.registers.length)}%">Register ${i + 1}</div>
      <div class="thing queue" style="${at({ x: p.x, y: p.y + 10 })}" title="${register.line.length} waiting">${register.line.map(() => '<span class="customer"></span>').join("")}</div>`;
  }).join("");
  const messes = Array.from({ length: sim.messes }, (_unused, i) => `<div class="thing mess" style="${at(place.mess(i))}" title="A mess on the floor"></div>`).join("");
  const padCrates = Array.from({ length: sim.padCrates }, () => '<span class="crate"></span>').join("");
  const stored = Array.from({ length: sim.settings.backroomCapacity }, (_unused, i) => `<span class="crate ${i < sim.backroomCrates ? "" : "empty"}"></span>`).join("");
  const stations = sim.stations.map((_station, i) => `<div class="thing station" style="${at(place.station(i))}" title="Charging station ${i + 1}">⚡</div>`).join("");
  const area = (left, top, width, height, name, inner, title) => `<div class="area" style="left:${left}%;top:${top}%;width:${width}%;height:${height}%" title="${escape(title)}"><span class="area-name">${name}</span><div class="crates">${inner}</div></div>`;
  const backroom = area(BACK.left + 3, 7, BACK.width - 6, 20, "Loading pad", padCrates, `${sim.padCrates} crates delivered, waiting to be carried in`)
    + area(BACK.left + 3, 34, BACK.width - 6, 26, `Stored crates (${sim.backroomCrates} of ${sim.settings.backroomCapacity})`, stored, "Crates ready to go onto shelves");

  let map = $("#map");
  if (!map) {
    $("#store").innerHTML = `<div class="map" id="map"><div id="mapThings"></div><div id="mapBots"></div></div>
      <div class="scores" id="scores"></div>
      <details class="log" id="logBox"><summary>What happened, moment by moment</summary><div class="log-lines" id="log"></div></details>`;
    map = $("#map");
  }
  $("#mapThings").innerHTML = `
    <div class="room" style="left:${SALES.left}%;width:${SALES.width}%"><span class="room-name">Sales floor</span></div>
    <div class="room" style="left:${BACK.left}%;width:${BACK.width}%"><span class="room-name">Backroom</span></div>
    ${shelves}${messes}${registers}${backroom}${stations}`;

  // Robots keep their element between redraws so they glide from job to job.
  const layer = $("#mapBots");
  const counters = {};
  const ids = new Set();
  sim.robots.forEach((live, index) => {
    ids.add(live.id);
    let bot = layer.querySelector(`[data-bot="${live.id}"]`);
    if (!bot) {
      bot = document.createElement("div");
      bot.className = "bot";
      bot.dataset.bot = live.id;
      layer.append(bot);
    }
    const spot = robotSpot(live, index, place, counters);
    const off = live.noPower || live.outOfPower;
    bot.classList.toggle("off", off);
    bot.style.left = `${spot.x}%`;
    bot.style.top = `${spot.y}%`;
    bot.dataset.index = index;
    bot.title = `${live.name}: ${activity(live).text}`;
    bot.innerHTML = `<div class="body" style="background:${colorOf(index)}">${escape(live.name.trim()[0] ?? "?")}</div>
      <div class="charge ${live.battery < 0.2 ? "low" : ""}"><div style="width:${live.battery * 100}%"></div></div>
      <div class="label">${escape(live.name)}</div>`;
  });
  for (const bot of [...layer.children]) if (!ids.has(bot.dataset.bot)) bot.remove();

  const st = sim.stats;
  const lost = st.leftEmptyShelf + st.leftLongLine + st.leftTooSlow;
  $("#scores").innerHTML = `
    <div class="score"><div class="n">${money(st.sales)}</div><div class="what">Money from sales</div></div>
    <div class="score"><div class="n">${st.served}</div><div class="what">Customers served (of ${st.customers} who came in)</div></div>
    <div class="score" title="Empty shelf: ${st.leftEmptyShelf}. Line too long: ${st.leftLongLine}. Waited too long: ${st.leftTooSlow}."><div class="n" style="color:${lost ? "var(--bad)" : "inherit"}">${lost}</div><div class="what">Customers who left unhappy (hover for why)</div></div>`;
  $("#log").innerHTML = [...sim.log].reverse().map((entry) => `<div><span>${clock(entry.time)}</span>${escape(entry.text)}</div>`).join("") || "Nothing yet.";
}

function renderControls() {
  const done = sim && sim.time >= setup.settings.shiftSeconds;
  $("#play").textContent = timer ? "Pause" : "Play";
  for (const id of ["play", "stepOne", "runAll"]) $(`#${id}`).disabled = !sim || done;
  $("#speed").innerHTML = [1, 5, 20].map((value) => `<option value="${value}" ${value === speed ? "selected" : ""}>${value}x speed</option>`).join("");
  $("#clock").textContent = sim ? `${clock(sim.time)} of ${clock(setup.settings.shiftSeconds)}${done ? ", shift over" : ""}` : "";
}

// ---------- Robots tab ----------

/** One command row on a custom board. `where` holds the data attributes that say which command it is. */
function ruleRow(rule, i, count, where, result) {
  const tools = `<span class="tools">
    <button data-move="-1" ${where} data-rule="${i}" ${i === 0 ? "disabled" : ""} title="Move up (checked sooner)">▲</button>
    <button data-move="1" ${where} data-rule="${i}" ${i === count - 1 ? "disabled" : ""} title="Move down (checked later)">▼</button>
    <button data-delete-rule="${i}" ${where} title="Remove this command">✕</button></span>`;
  return `<div class="rule ${rule.on === false ? "off" : ""} ${result === "chosen" ? "chosen" : ""}" title="${result ? escape(WHY[result]) : ""}">
    <span class="n">${i + 1}</span>
    <input type="checkbox" ${where} data-rule="${i}" data-field="on" title="Switch this command on or off" ${rule.on === false ? "" : "checked"}>
    <span class="what"><span class="word">If</span><select ${where} data-rule="${i}" data-field="condition">${options(CONDITIONS, rule.condition)}</select><span class="word">then</span><select ${where} data-rule="${i}" data-field="action">${options(ACTIONS, rule.action)}</select></span>
    ${tools}
  </div>`;
}

function boardOptions(selected, programLength) {
  const group = (kind, heading) => `<optgroup label="${heading}">${setup.parts.boards.filter((board) => board.kind === kind).map((board) => {
    const tooSmall = kind === "custom" && board.commands < programLength;
    return `<option value="${board.id}" ${board.id === selected ? "selected" : ""} ${tooSmall ? "disabled" : ""}>${escape(board.name)}${kind === "custom" ? "" : ` (${board.power} power)`}${tooSmall ? " - too small" : ""}</option>`;
  }).join("")}</optgroup>`;
  return group("prefab", "Prefab: does one fixed job") + group("custom", "Custom: write your own commands");
}

function robotCard(robot, r) {
  const parts = setup.parts;
  const live = sim?.robots[r];
  const frame = findFrame(parts, robot.frame);
  const cell = findCell(parts, robot.cell);
  const needed = powerNeeded(robot, parts);
  const over = needed > cell.capacity;
  const now = over ? { text: `Won't switch on: needs ${needed - cell.capacity} more power`, bad: true } : activity(live);
  const battery = live ? live.battery : 1;
  const row = `<div class="robot-row" data-open="${r}">
    <span class="swatch" style="background:${colorOf(r)}"></span>
    <span><div class="name">${escape(robot.name)}</div><div class="now ${now.bad ? "bad" : ""}">${escape(now.text)}</div></span>
    <span class="mini" title="Charge left"><span class="bar ${battery < 0.2 ? "low" : ""}"><div style="width:${battery * 100}%"></div></span>${Math.round(battery * 100)}%</span>
  </div>`;
  if (openRobot !== r) return `<div class="robot ${now.bad ? "problem" : ""}">${row}</div>`;

  const results = checksFor(live);
  const frameOptions = parts.frames.map((entry) => `<option value="${entry.id}" ${entry.id === robot.frame ? "selected" : ""} ${entry.boardSlots < robot.boards.length ? "disabled" : ""}>${escape(entry.name)}${entry.boardSlots < robot.boards.length ? " - too few slots" : ""}</option>`).join("");
  const cellOptions = parts.cells.map((entry) => `<option value="${entry.id}" ${entry.id === robot.cell ? "selected" : ""}>${escape(entry.name)}</option>`).join("");
  const breakdown = [`${frame.name} ${frame.power}`, ...robot.boards.map((fitted) => `${findBoard(parts, fitted.board).name} ${boardPower(fitted, parts)}`)].join(" + ");
  const workSeconds = cell.drainRate > 0 && setup.settings.standardDrain > 0 ? Math.round(cell.charge / (setup.settings.standardDrain * cell.drainRate)) : Infinity;
  const slots = robot.boards.map((fitted, s) => {
    const board = findBoard(parts, fitted.board);
    const custom = board.kind === "custom";
    const where = `data-robot="${r}" data-slot="${s}"`;
    const head = `<div class="slot-head"><span class="n">${s + 1}</span>
      <select ${where} data-field="board">${boardOptions(board.id, custom ? fitted.program.length : 0)}</select>
      <span class="tools">
        <button data-board-move="-1" ${where} ${s === 0 ? "disabled" : ""} title="Move this board up (checked sooner)">▲</button>
        <button data-board-move="1" ${where} ${s === robot.boards.length - 1 ? "disabled" : ""} title="Move this board down (checked later)">▼</button>
        <button data-board-remove ${where} title="Take this board out">✕</button></span></div>`;
    if (!custom) {
      const result = live ? results.get(`${s}:0`) : null;
      return `<div class="slot ${result === "chosen" ? "active" : ""}" title="${result ? escape(WHY[result]) : ""}">${head}
        <div class="ability">${escape(findAbility(board.ability)?.description ?? "Unknown ability")}</div></div>`;
    }
    const rules = fitted.program.map((rule, i) => ruleRow(rule, i, fitted.program.length, where, live ? results.get(`${s}:${i}`) : null)).join("");
    const active = fitted.program.some((_rule, i) => results.get(`${s}:${i}`) === "chosen");
    const free = board.commands - fitted.program.length;
    return `<div class="slot ${active ? "active" : ""}">${head}<div class="rules">${rules}</div>
      <div class="add-row"><span>${free > 0 ? `${free} more command${free === 1 ? "" : "s"} fit` : "Board is full"}</span><button class="small" data-add-command ${where} ${free <= 0 ? "disabled" : ""}>Add command</button></div></div>`;
  }).join("");
  const emptySlots = frame.boardSlots - robot.boards.length;
  const empty = emptySlots > 0 ? `<div class="slot empty"><div class="slot-head"><span class="n">${robot.boards.length + 1}</span>
    <select data-robot="${r}" data-slot="${robot.boards.length}" data-field="board"><option value="" selected>Empty slot: pick a board...</option>${boardOptions(null, 0)}</select></div></div>` : "";
  return `<div class="robot ${now.bad ? "problem" : ""}">${row}
    <div class="editor">
      <div class="build">
        <label>Name <input data-robot="${r}" data-field="name" value="${escape(robot.name)}"></label>
        <label>Frame <select data-robot="${r}" data-field="frame">${frameOptions}</select></label>
        <label>Power cell <select data-robot="${r}" data-field="cell">${cellOptions}</select></label>
      </div>
      <div class="power ${over ? "over" : ""}" title="${escape(breakdown)}"><span>Power ${needed} of ${cell.capacity}</span>
        <div class="meter"><div style="width:${Math.min(1, cell.capacity ? needed / cell.capacity : 1) * 100}%"></div></div></div>
      <div class="facts">Speed ${frame.speed}. A full charge lasts about ${workSeconds === Infinity ? "forever" : `${workSeconds} seconds`} of work and refills in ${Math.round(cell.charge / cell.chargeRate)} seconds.</div>
      <div class="section">Logic boards, checked from the top. The robot does the first one with something to do.</div>
      ${slots}${empty}
      <div class="robot-foot"><button class="small ghost" data-delete-robot="${r}">Remove robot</button></div>
    </div></div>`;
}

// ---------- Parts tab ----------

const usedBy = (list, id) => setup.robots.filter((robot) => (list === "frames" ? robot.frame === id : list === "cells" ? robot.cell === id : robot.boards.some((fitted) => fitted.board === id)));
function removeButton(list, part, users, last) {
  return `<button class="small ghost" data-remove-part="${list}" data-id="${part.id}" ${users.length ? `disabled title="Used by ${escape(users.map((robot) => robot.name).join(", "))}"` : last ? 'disabled title="Keep at least one"' : 'title="Remove this part"'}>✕</button>`;
}

function partRow(list, part, columns) {
  const users = usedBy(list, part.id);
  const last = list !== "boards" && setup.parts[list].length <= 1;
  const cells = columns.map(([key, , minimum, whole, help]) => `<td><input type="number" min="${minimum}" step="${whole ? 1 : "any"}" data-part="${list}" data-id="${part.id}" data-field="${key}" value="${part[key]}" title="${escape(help)}"></td>`).join("");
  return `<tr><td><input class="name" data-part="${list}" data-id="${part.id}" data-field="name" value="${escape(part.name)}"></td>${cells}<td>${removeButton(list, part, users, last)}</td></tr>`;
}

function partsTab() {
  const parts = setup.parts;
  const table = (list, columns, rows) => `<table class="parts-table"><tr><th>Name</th>${columns.map(([, heading, , , help]) => `<th title="${escape(help)}">${heading}</th>`).join("")}<th></th></tr>${rows.map((part) => partRow(list, part, columns)).join("")}</table>`;
  const prefabs = parts.boards.filter((board) => board.kind === "prefab").map((board) => {
    const where = `data-part="boards" data-id="${board.id}"`;
    return `<div class="prefab-card"><div class="row">
        <input class="name" ${where} data-field="name" value="${escape(board.name)}" title="Name">
        <select ${where} data-field="ability" title="Which built-in job it does">${options(PREFAB_ABILITIES, board.ability)}</select>
        <input type="number" min="0" step="any" ${where} data-field="power" value="${board.power}" title="Power needed">
        ${removeButton("boards", board, usedBy("boards", board.id), false)}</div>
      <div class="desc">${escape(findAbility(board.ability)?.description ?? "Unknown ability")}</div></div>`;
  }).join("");
  const costTable = (kind, list) => `<table class="parts-table"><tr><th>${kind === "conditions" ? "If..." : "Then..."}</th><th>Power</th></tr>${list.map((entry) => `<tr><td>${escape(entry.label)}</td><td><input type="number" min="0" step="any" data-cost="${kind}" data-id="${entry.id}" value="${parts.commandPower[kind][entry.id] ?? 0}"></td></tr>`).join("")}</table>`;
  return `
    <h3 class="part-title">Frames <button class="small" data-add-part="frames">Add</button></h3>
    <p class="part-help">The body. Sets speed and how many logic boards fit. Hover a heading for what it means.</p>
    ${table("frames", PART_COLUMNS.frames, parts.frames)}
    <h3 class="part-title">Power cells <button class="small" data-add-part="cells">Add</button></h3>
    <p class="part-help">Capacity is the most power a robot's frame and boards can need. Charge runs down as it works: each working second uses the standard drain times the drain rate, and waiting uses ${SIM_RULES.waitingDrain * 100}% of that.</p>
    ${table("cells", PART_COLUMNS.cells, parts.cells)}
    <h3 class="part-title">Prefab boards <button class="small" data-add-part="prefab">Add</button></h3>
    <p class="part-help">Each does one fixed job built into the game. Players can't see inside or change it. Pick the job, name and power need.</p>
    ${prefabs}
    <h3 class="part-title">Custom boards <button class="small" data-add-part="custom">Add</button></h3>
    <p class="part-help">Blank boards players write commands on. Each command adds its own power from the tables below.</p>
    ${table("boards", PART_COLUMNS.custom, parts.boards.filter((board) => board.kind === "custom"))}
    <h3 class="part-title">Power each command adds</h3>
    <div class="costs">${costTable("conditions", CONDITIONS)}${costTable("actions", ACTIONS)}</div>`;
}

function storeTab() {
  const s = setup.settings;
  return `<p class="hint">Changing any of these restarts the shift.</p>
    <div class="settings">${SETTINGS.map(([key, label]) => `<label>${label} <input type="number" min="0" step="${key === "standardDrain" ? "any" : 1}" data-setting="${key}" value="${s[key]}"></label>`).join("")}</div>`;
}

function renderSide() {
  const tabs = `<div class="tabs">${[["robots", "Robots"], ["parts", "Parts"], ["store", "Store setup"]].map(([id, label]) => `<button class="tab ${tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`).join("")}</div>`;
  let body = "";
  if (tab === "robots") body = `<p class="hint">Click a robot to open it. Its dot on the map shows where it is.</p>${setup.robots.map(robotCard).join("")}<button class="small" id="addRobot">Add robot</button>`;
  else if (tab === "parts") body = partsTab();
  else body = storeTab();
  $("#side").innerHTML = tabs + body;
  updateButtons();
}

function render() {
  renderSide();
  renderMap();
  renderControls();
}

function restart() {
  stop();
  sim = createSim(clone(setup), 1);
  $("#mapBots")?.replaceChildren();
  render();
}

// Robot and part edits go straight into the running store, so you can tune while it runs.
function syncRobots() {
  if (!sim || sim.robots.length !== setup.robots.length) return restart();
  const parts = clone(setup.parts);
  setup.robots.forEach((robot, index) => applyBuild(sim.robots[index], clone(robot), parts));
  render();
}

function tick() {
  for (let n = 0; n < speed; n += 1) step(sim);
  if (sim.time >= setup.settings.shiftSeconds) stop();
  // Redrawing the side panel would close a dropdown you're in the middle of picking from.
  if (!$("#side").contains(document.activeElement)) renderSide();
  renderMap();
  renderControls();
}
function stop() {
  clearInterval(timer);
  timer = null;
}

function changed() {
  syncRobots();
  status(dirty() ? "Unsaved changes" : "");
}

function invalid(field, why) {
  field.classList.add("invalid");
  field.title = why;
  updateButtons();
}

const partList = (list) => (list === "prefab" || list === "custom" ? "boards" : list);
const findPart = (list, id) => setup.parts[partList(list)].find((part) => part.id === id);
// The commands of the custom board a command row belongs to.
function programAt(data) {
  return setup.robots[Number(data.robot)].boards[Number(data.slot)].program;
}

$("#side").addEventListener("change", (event) => {
  const field = event.target;
  const data = field.dataset;
  const key = data.field;
  if (data.setting) {
    const value = Number(field.value);
    const minimum = ["shiftSeconds", "registers", "shelves", "deliveryEverySeconds"].includes(data.setting) ? 1 : 0;
    if (!Number.isFinite(value) || value < minimum) return invalid(field, `Must be ${minimum} or more.`);
    setup.settings[data.setting] = value;
    restart();
    return status(dirty() ? "Unsaved changes" : "");
  }
  if (data.cost) {
    const value = Number(field.value);
    if (!Number.isFinite(value) || value < 0) return invalid(field, "Must be 0 or more.");
    setup.parts.commandPower[data.cost][data.id] = value;
  } else if (data.rule !== undefined) {
    const rule = programAt(data)[Number(data.rule)];
    rule[key] = key === "on" ? field.checked : field.value;
  } else if (data.part) {
    const part = findPart(data.part, data.id);
    if (key === "name") {
      if (!field.value.trim()) return invalid(field, "Needs a name.");
      part.name = field.value.trim();
    } else if (key === "ability") {
      part.ability = field.value;
    } else {
      const value = Number(field.value);
      const column = [...PART_COLUMNS.frames, ...PART_COLUMNS.cells, ...PART_COLUMNS.custom, ["power", "", 0, false]].find(([name]) => name === key);
      const [, , minimum, whole] = column;
      // A part can't shrink below what a robot already has fitted in it.
      let floor = minimum;
      if (key === "boardSlots") floor = Math.max(minimum, ...usedBy("frames", part.id).map((robot) => robot.boards.length));
      if (key === "commands") floor = Math.max(minimum, ...setup.robots.flatMap((robot) => robot.boards.filter((fitted) => fitted.board === part.id).map((fitted) => fitted.program.length)));
      if (!Number.isFinite(value) || value < floor || (whole && !Number.isInteger(value))) {
        return invalid(field, floor > minimum ? `A robot already uses ${floor}. Take some out first.` : `Must be ${whole ? "a whole number, " : ""}${minimum} or more.`);
      }
      part[key] = value;
    }
  } else if (data.robot !== undefined) {
    const robot = setup.robots[Number(data.robot)];
    if (key === "name") {
      if (!field.value.trim()) return invalid(field, "Needs a name.");
      robot.name = field.value.trim();
    } else if (key === "frame" || key === "cell") {
      robot[key] = field.value;
    } else if (key === "board") {
      const slot = Number(data.slot);
      const board = findBoard(setup.parts, field.value);
      const before = robot.boards[slot];
      // Swapping one custom board for another keeps the commands you wrote.
      const program = board.kind === "custom" ? (before?.program ?? []) : undefined;
      robot.boards[slot] = program ? { board: board.id, program } : { board: board.id };
    }
  } else return;
  changed();
});

function uniqueId(name) {
  const base = name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "part";
  const taken = new Set(["frames", "cells", "boards"].flatMap((list) => setup.parts[list].map((part) => part.id)));
  let id = base;
  for (let n = 2; taken.has(id); n += 1) id = `${base}_${n}`;
  return id;
}

function openRobotCard(index) {
  openRobot = openRobot === index ? null : index;
  tab = "robots";
  renderSide();
}

$("#store").addEventListener("click", (event) => {
  const bot = event.target.closest(".bot");
  if (bot) openRobotCard(Number(bot.dataset.index));
});

$("#side").addEventListener("click", (event) => {
  const header = event.target.closest(".robot-row");
  if (header) return openRobotCard(Number(header.dataset.open));
  const target = event.target.closest("button");
  if (!target) return;
  const data = target.dataset;
  if (data.tab) {
    tab = data.tab;
    return renderSide();
  }
  const robot = data.robot !== undefined ? setup.robots[Number(data.robot)] : null;
  if (target.id === "addRobot") {
    setup.robots.push({ name: `Robot ${setup.robots.length + 1}`, frame: setup.parts.frames[0].id, cell: setup.parts.cells[0].id, boards: [] });
    openRobot = setup.robots.length - 1;
  } else if (data.deleteRobot !== undefined) {
    if (!confirm(`Remove ${setup.robots[Number(data.deleteRobot)].name}?`)) return;
    setup.robots.splice(Number(data.deleteRobot), 1);
    openRobot = null;
  } else if (data.addCommand !== undefined) {
    programAt(data).push({ condition: "always", action: "wait", on: true });
  } else if (data.deleteRule !== undefined) {
    programAt(data).splice(Number(data.deleteRule), 1);
  } else if (data.move !== undefined) {
    const program = programAt(data);
    const from = Number(data.rule);
    const to = from + Number(data.move);
    [program[from], program[to]] = [program[to], program[from]];
  } else if (data.boardMove !== undefined) {
    const from = Number(data.slot);
    const to = from + Number(data.boardMove);
    [robot.boards[from], robot.boards[to]] = [robot.boards[to], robot.boards[from]];
  } else if (data.boardRemove !== undefined) {
    robot.boards.splice(Number(data.slot), 1);
  } else if (data.addPart) {
    const part = NEW_PART[data.addPart]();
    setup.parts[partList(data.addPart)].push({ id: uniqueId(part.name), ...part });
  } else if (data.removePart) {
    const list = setup.parts[partList(data.removePart)];
    list.splice(list.findIndex((part) => part.id === data.id), 1);
  } else return;
  changed();
});

$("#speed").addEventListener("change", (event) => {
  speed = Number(event.target.value);
});
$("#play").addEventListener("click", () => {
  if (timer) stop();
  else timer = setInterval(tick, 1000);
  renderControls();
});
$("#stepOne").addEventListener("click", () => {
  step(sim);
  render();
});
$("#runAll").addEventListener("click", () => {
  stop();
  while (sim.time < setup.settings.shiftSeconds) step(sim);
  render();
});
$("#restart").addEventListener("click", () => restart());

$("#undo").addEventListener("click", () => {
  setup = clone(saved);
  restart();
  status("");
});

$("#save").addEventListener("click", async () => {
  status("Saving...");
  const response = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(setup) });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) return status((body.problems ?? ["Couldn't save."]).join("\n"), "bad");
  saved = clone(setup);
  updateButtons();
  status("Saved", "good");
});

window.addEventListener("beforeunload", (event) => {
  if (dirty()) event.preventDefault();
});

fetch("/api/data").then((response) => response.json()).then((data) => {
  saved = data;
  setup = clone(data);
  restart();
  status("");
}).catch(() => status("Couldn't load. Is npm run robots still running?", "bad"));
</script>
</body>
</html>
