<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item Balancing - Space Arms Dealer</title>
<style>
  :root { color-scheme: dark; --bg: #0b1120; --panel: #111a2e; --line: #1f2b45; --text: #e2e8f5; --dim: #7d8cab; --accent: #38bdf8; --good: #4ade80; --bad: #f87171; --changed: #3a2e0c; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 10px 0 0; }
  header input[type=search], header select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; font: inherit; }
  header input[type=search] { width: 220px; }
  header label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  button { background: #1e293b; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 7px 14px; cursor: pointer; font: inherit; }
  button.primary { background: #0c4a6e; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #status { color: var(--dim); margin-left: auto; }
  #status.bad { color: var(--bad); white-space: pre-line; }
  #status.good { color: var(--good); }
  .wrap { overflow: auto; flex: 1; min-height: 0; }
  table { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  th { position: sticky; top: 0; z-index: 2; background: #16213a; text-align: right; padding: 8px 9px; border-bottom: 2px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none; vertical-align: bottom; }
  th.left { text-align: left; }
  th.sorted { color: var(--accent); }
  th.sorted::after { content: " ▲"; }
  th.sorted.desc::after { content: " ▼"; }
  th .sub { display: block; font-weight: normal; color: var(--dim); font-size: 12px; }
  th.edit { color: #fde68a; }
  td { padding: 4px 9px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.dim { color: var(--dim); }
  td .sub { display: block; color: var(--dim); font-size: 12px; }
  tr.changed td { background: var(--changed); }
  tr.item:hover td { background: #16213a; }
  tr.group td { background: #0f1a30; color: var(--accent); font-weight: 600; padding: 14px 12px 6px; border-bottom: 2px solid var(--line); }
  tr.group td span { color: var(--dim); font-weight: normal; margin-left: 10px; }
  td img { width: 36px; height: 36px; object-fit: contain; image-rendering: pixelated; display: block; }
  td.name { font-weight: 500; white-space: normal; min-width: 200px; max-width: 260px; }
  td input, td select { background: #0f172a; color: #fde68a; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  td input:focus, td select:focus { border-color: var(--accent); outline: none; }
  td select option { background: var(--panel); color: var(--text); }
  td input.invalid { border-color: var(--bad); }
  input.price { width: 70px; text-align: right; }
  select.contract { width: 200px; color: var(--text); }
  .profit { display: flex; align-items: center; justify-content: flex-end; gap: 10px; font-weight: 600; color: var(--good); }
  .bar { width: 70px; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; background: var(--good); }
  .help { padding: 8px 16px; color: var(--dim); border-bottom: 1px solid var(--line); }
  .help b { color: #fde68a; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Item Balancing</h1>
  <input type="search" id="search" placeholder="Search by name">
  <select id="typeFilter"><option value="">All item types</option></select>
  <label><input type="checkbox" id="onlyPicked"> Only ticked items</label>
  <label><input type="checkbox" id="onlyChanged"> Only edited items</label>
  <button id="save" class="primary" disabled>Save</button>
  <button id="revert" disabled>Undo all edits</button>
  <span id="status">Loading...</span>
</header>
<div class="help" id="help"></div>
<div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<script type="module">
const state = { items: [], original: [], licenses: new Map(), rules: null, sort: { key: "level", desc: false }, picked: new Set(), maxProfit: 1 };

const money = (value) => Math.round(value).toLocaleString("en-US");
const levelOf = (item) => state.licenses.get(item.license)?.level ?? null;
const perCrate = (item) => Math.floor(state.rules.crateUnits / item.boxSize) || 0;
const supplierPrice = (item) => (item.baseCost * item.supplyPercent) / 100;
const crateValue = (item) => perCrate(item) * item.baseCost;
// Same rounding as Market.getSupplyCost: once for the whole order, not per item.
const crateCost = (item) => Math.max(1, Math.round(supplierPrice(item) * perCrate(item)));
const crateProfit = (item) => crateValue(item) - crateCost(item);
const typeOf = (item) => item.tags?.[0] ?? "";
const kindOf = (item) => item.tags?.[item.tags.length - 1] ?? "";

// Yellow headers are the ones you can change; the rest are worked out from them.
const COLUMNS = [
  { key: "pick", label: "Compare", left: true, sort: (item) => (state.picked.has(item.id) ? 0 : 1) },
  { key: "icon", label: "", left: true },
  { key: "name", label: "Item", left: true, sort: (item) => item.name },
  { key: "level", label: "Unlocks at", left: true, edit: true, sort: (item) => (levelOf(item) ?? 999) * 1000 + item.baseCost / 1e6 },
  { key: "baseCost", label: "Base price", edit: true, sort: (item) => item.baseCost },
  { key: "supplyPercent", label: "Supplier %", edit: true, sort: (item) => item.supplyPercent },
  { key: "supplierPrice", label: "Supplier price", sort: supplierPrice },
  { key: "boxSize", label: "Item size", edit: true, sort: (item) => item.boxSize },
  { key: "perCrate", label: "Crate holds", sort: perCrate },
  { key: "crateValue", label: "Crate sells for", sort: crateValue },
  { key: "crateCost", label: "Crate costs", sort: crateCost },
  { key: "crateProfit", label: "Crate profit", sort: crateProfit },
];

async function load() {
  const data = await (await fetch("/api/data")).json();
  state.rules = data.rules;
  state.licenses = new Map(data.licenses.map((license) => [license.id, license]));
  state.items = data.items.map((item) => structuredClone(item));
  state.original = data.items.map((item) => JSON.stringify(item));
  const types = [...new Set(state.items.map(typeOf))].filter(Boolean).sort();
  document.getElementById("typeFilter").innerHTML = '<option value="">All item types</option>' + types.map((type) => `<option>${escape(type)}</option>`).join("");
  document.getElementById("help").innerHTML =
    `You can change the <b>yellow</b> columns. ` +
    `A crate has room for ${state.rules.crateUnits}, so an item of size 4 fits 5 per crate. One shelf space holds the same as one crate. ` +
    `Profit is selling a full crate at base price, minus what the supplier charges for it (supplier % of base price).`;
  render();
  setStatus(`${state.items.length} items.`);
}

function escape(text) {
  return String(text ?? "").replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char]);
}

const isChanged = (index) => JSON.stringify(state.items[index]) !== state.original[index];
const changedCount = () => state.items.filter((_item, index) => isChanged(index)).length;

function renderHead() {
  document.getElementById("head").innerHTML = "<tr>" + COLUMNS.map((column) => {
    const sorted = state.sort.key === column.key;
    const classes = [column.left && "left", column.edit && "edit", sorted && "sorted", sorted && state.sort.desc && "desc"].filter(Boolean).join(" ");
    const sub = column.sub ? `<span class="sub">${escape(column.sub)}</span>` : "";
    return `<th data-key="${column.key}" class="${classes}">${column.label}${sub}</th>`;
  }).join("") + "</tr>";
}

function visibleRows() {
  const search = document.getElementById("search").value.trim().toLowerCase();
  const type = document.getElementById("typeFilter").value;
  const onlyPicked = document.getElementById("onlyPicked").checked;
  const onlyChanged = document.getElementById("onlyChanged").checked;
  const rows = state.items.map((item, index) => ({ item, index })).filter(({ item, index }) =>
    (!type || typeOf(item) === type) &&
    (!onlyPicked || state.picked.has(item.id)) &&
    (!onlyChanged || isChanged(index)) &&
    (!search || item.name.toLowerCase().includes(search)));
  const column = COLUMNS.find((entry) => entry.key === state.sort.key);
  rows.sort((a, b) => {
    const left = column.sort(a.item);
    const right = column.sort(b.item);
    const order = typeof left === "number" ? left - right : String(left).localeCompare(String(right));
    return (state.sort.desc ? -order : order) || a.item.baseCost - b.item.baseCost;
  });
  return rows;
}

function cell(item, index, key) {
  switch (key) {
    case "pick": return `<td><input type="checkbox" data-pick="${index}" ${state.picked.has(item.id) ? "checked" : ""}></td>`;
    case "icon": return `<td>${item.image ? `<img src="/${escape(item.image)}" alt="" loading="lazy">` : ""}</td>`;
    case "name": return `<td class="name">${escape(item.name)}<span class="sub">${escape(typeOf(item))}: ${escape(kindOf(item))}</span></td>`;
    case "level": {
      const options = [...state.licenses.values()]
        .filter((license) => license.level !== null || license.id === item.license)
        .sort((a, b) => (a.level ?? 0) - (b.level ?? 0) || a.name.localeCompare(b.name))
        .map((license) => `<option value="${escape(license.id)}" ${license.id === item.license ? "selected" : ""}>Lv ${license.level ?? "?"}: ${escape(license.name)}</option>`);
      return `<td><select class="contract" data-edit="${index}" data-key="license">${options.join("")}</select></td>`;
    }
    case "baseCost":
    case "supplyPercent": return `<td class="num"><input type="number" step="any" class="price" data-edit="${index}" data-key="${key}" value="${item[key]}"></td>`;
    case "boxSize": {
      const options = state.rules.boxSizes.map((size) => `<option ${size === item.boxSize ? "selected" : ""}>${size}</option>`);
      return `<td class="num"><select data-edit="${index}" data-key="boxSize">${options.join("")}</select></td>`;
    }
    default: return `<td class="num" data-out="${key}">${outputHtml(item, key)}</td>`;
  }
}

function outputHtml(item, key) {
  if (key === "supplierPrice") return supplierPrice(item).toLocaleString("en-US", { maximumFractionDigits: 2 });
  if (key === "perCrate") return `${perCrate(item)}`;
  if (key === "crateValue") return money(crateValue(item));
  if (key === "crateCost") return money(crateCost(item));
  const profit = crateProfit(item);
  const width = Math.max(0, Math.min(100, (profit / state.maxProfit) * 100));
  return `<div class="profit">${money(profit)}<div class="bar"><div style="width:${width}%"></div></div></div>`;
}

function render() {
  state.maxProfit = Math.max(1, ...state.items.map(crateProfit));
  renderHead();
  const grouped = state.sort.key === "level";
  let lastLevel;
  const html = [];
  for (const { item, index } of visibleRows()) {
    const level = levelOf(item);
    if (grouped && level !== lastLevel) {
      lastLevel = level;
      const count = state.items.filter((other) => levelOf(other) === level).length;
      html.push(`<tr class="group"><td colspan="${COLUMNS.length}">Shop level ${level ?? "?"}<span>${count} item${count === 1 ? "" : "s"} unlock here</span></td></tr>`);
    }
    html.push(`<tr class="item ${isChanged(index) ? "changed" : ""}" data-row="${index}">${COLUMNS.map((column) => cell(item, index, column.key)).join("")}</tr>`);
  }
  document.getElementById("body").innerHTML = html.join("");
  refreshButtons();
}

// Updates one row's worked-out numbers without redrawing, so typing keeps focus.
function refreshRow(index) {
  const row = document.querySelector(`tr[data-row="${index}"]`);
  if (!row) return;
  row.classList.toggle("changed", isChanged(index));
  for (const output of row.querySelectorAll("[data-out]")) output.innerHTML = outputHtml(state.items[index], output.dataset.out);
}

function refreshButtons() {
  const count = changedCount();
  document.getElementById("save").disabled = count === 0;
  document.getElementById("revert").disabled = count === 0;
  document.getElementById("save").textContent = count ? `Save ${count} edited item${count === 1 ? "" : "s"}` : "Save";
}

function setStatus(text, kind = "") {
  const status = document.getElementById("status");
  status.textContent = text;
  status.className = kind;
}

function applyEdit(target) {
  const index = Number(target.dataset.edit);
  const key = target.dataset.key;
  const value = key === "license" ? target.value : Number(target.value);
  state.items[index][key] = value;
  target.classList.toggle("invalid", key !== "license" && key !== "boxSize" && !(value > 0));
  refreshRow(index);
  refreshButtons();
}

document.getElementById("body").addEventListener("input", (event) => {
  if (event.target.dataset.edit !== undefined) applyEdit(event.target);
});
document.getElementById("body").addEventListener("change", (event) => {
  const target = event.target;
  if (target.dataset.pick !== undefined) {
    const id = state.items[Number(target.dataset.pick)].id;
    if (target.checked) state.picked.add(id);
    else state.picked.delete(id);
  } else if (target.dataset.edit !== undefined) {
    applyEdit(target);
    // A new contract can move the item to another level group.
    if (target.dataset.key === "license" && state.sort.key === "level") render();
  }
});
document.getElementById("head").addEventListener("click", (event) => {
  const key = event.target.closest("th")?.dataset.key;
  if (!key || key === "icon") return;
  state.sort = { key, desc: state.sort.key === key ? !state.sort.desc : false };
  render();
});
for (const id of ["search", "typeFilter", "onlyPicked", "onlyChanged"]) {
  document.getElementById(id).addEventListener("input", render);
}
document.getElementById("revert").addEventListener("click", () => {
  if (!confirm("Undo every edit since the last save?")) return;
  state.items = state.original.map((text) => JSON.parse(text));
  render();
  setStatus("Edits undone.");
});
document.getElementById("save").addEventListener("click", async () => {
  setStatus("Saving...");
  const response = await fetch("/api/items", { method: "POST", body: JSON.stringify(state.items) });
  const result = await response.json();
  if (!response.ok) {
    setStatus(`Not saved:\n${result.problems.join("\n")}`, "bad");
    return;
  }
  state.original = state.items.map((item) => JSON.stringify(item));
  render();
  setStatus(`Saved to data/Items.json.`, "good");
});
window.addEventListener("beforeunload", (event) => {
  if (changedCount()) event.preventDefault();
});
load().catch((error) => setStatus(`Couldn't load the items: ${error.message}`, "bad"));
</script>
</body>
</html>
