<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Arms Dealer UI Lab</title>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-layer">
        <div id="persistent-hud" class="hidden">
          <div class="hud-section">
            <button id="hud-main-menu-btn" class="hud-pause-btn" type="button"
              title="Leave this game and go back to the title screen">MAIN MENU</button>
            <button id="hud-debug-info-btn" class="hud-pause-btn" type="button"
              title="Save a screenshot and state report to a local debug session">Debug Info</button>
            <button id="hud-debug-shop-upgrade-btn" class="hud-pause-btn" type="button"
              title="Debug: open the next sales floor expansion for free">+Floor</button>
            <button id="hud-debug-backroom-upgrade-btn" class="hud-pause-btn" type="button"
              title="Debug: open the next backroom upgrade for free">+Backroom</button>
            <button id="hud-debug-quickstart-btn" class="hud-pause-btn" type="button"
              title="Debug: buy and place two 2x2 shelves, each spot filled with one of the first 6 items">Quickstart</button>
            <button id="hud-debug-skip-shifts-btn" class="hud-pause-btn" type="button"
              title="Debug: play the next 4 shifts instantly, signing the next contract and keeping every item fully stocked">Skip 4 Shifts</button>
            <button id="hud-debug-employee-testing-btn" class="hud-pause-btn" type="button"
              title="Debug: play shifts like a good player until the shop reaches Level 5, restock every shelf, and make sure there's enough money to hire one employee">Employee Test</button>
            <div class="hud-stat">
              <span class="hud-label">MONEY</span>
              <span id="hud-credits" class="hud-value">0</span>
            </div>
            <div class="hud-stat">
              <span class="hud-label">REPUTATION</span>
              <span id="hud-rep" class="hud-value rep">0</span>
            </div>
            <div class="hud-stat">
              <span class="hud-label">SHOP LEVEL</span>
              <span id="hud-shop-level" class="hud-value rep">1</span>
            </div>
            <div class="hud-stat">
              <span class="hud-label">CLEANLINESS</span>
              <span id="hud-cleanliness" class="hud-value">20/20</span>
            </div>
            <div class="hud-stat" style="display:none">
              <span class="hud-label">PRESENTATION</span>
              <span id="hud-presentation" class="hud-value">20/20</span>
            </div>
            <div id="hud-stamina" class="hud-stat hud-stamina" role="progressbar"
              aria-label="Player stamina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"
              title="Hold Shift while moving to dash. Stamina recovers while walking or resting. When empty, recover to 25% before dashing again.">
              <span class="hud-label">STAMINA</span>
              <div class="hud-stamina-track"><div id="hud-stamina-fill" class="hud-stamina-fill"></div></div>
              <span id="hud-stamina-value" class="hud-value time">100%</span>
            </div>
            <div id="hud-hovercart" class="hud-stat hud-hovercart hidden" role="progressbar"
              aria-label="Hovercart battery" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"
              title="Hovercart battery. It drains while the hovercart is on, faster while it moves and for every crate on it. It charges while docked at its charger.">
              <span class="hud-label">HOVERCART</span>
              <div class="hud-stamina-track"><div id="hud-hovercart-fill" class="hud-hovercart-fill"></div></div>
              <span id="hud-hovercart-value" class="hud-value time">100%</span>
            </div>
          </div>
          <div class="hud-section">
            <button id="hud-save-btn" class="hud-pause-btn" type="button" disabled
              title="Save while the store is closed">SAVE</button>
            <div class="hud-stat">
              <span class="hud-label">SHIFT</span>
              <span id="hud-shift-time" class="hud-value time">08:00</span>
            </div>
            <button id="hud-pause-btn" class="hud-pause-btn" data-pad-autofocus aria-label="Pause/resume shift clock">
              PAUSE
            </button>
            <button id="hud-store-toggle-btn" class="hud-pause-btn hidden" type="button"
              aria-pressed="false"
              title="Temporarily stop new customers. Customers already inside can finish shopping, and the shift clock keeps running.">
              CLOSE STORE
            </button>
            <button id="hud-start-shift-btn" class="hud-start-shift-btn hidden" data-pad-autofocus aria-label="Start shift">
              START SHIFT
            </button>
            <button id="hud-end-day-btn" class="hud-end-day-btn hidden" data-pad-autofocus type="button"
              title="The shift is over. Open Finances to see today's receipt and end the day.">
              END DAY
            </button>
          </div>
          <div id="debug-feedback" class="hud-debug-feedback hidden">
            <span id="debug-status" role="status" aria-live="polite"></span>
            <button id="debug-folder-btn" class="hud-pause-btn hidden" type="button">OPEN FOLDER</button>
          </div>
        </div>
        <!-- Bottom bar: what's in the crate the green arrow points at, and on the right what the
             buttons do here (or a short warning). Holding cards sit just above its right end. -->
        <div id="crate-footer" class="crate-footer hidden">
          <span class="crate-footer-label">CRATE</span>
          <div class="crate-footer-contents">
            <img class="crate-footer-image hidden" alt="">
            <span class="crate-footer-name"></span>
            <span class="crate-footer-count"></span>
          </div>
          <div id="game-message" class="game-message hidden" role="status" aria-live="polite" aria-atomic="true"></div>
        </div>
        <div id="holding-cards" class="holding-cards hidden"></div>
      </div>
      <div id="loading-screen" class="loading-screen hidden" role="status" aria-live="polite">LOADING...</div>
    </div>
    <dialog id="runtime-error-dialog" class="runtime-error-dialog" aria-labelledby="runtime-error-heading">
      <div class="runtime-error-form">
        <h2 id="runtime-error-heading">Something went wrong</h2>
        <p>The game recorded an error. You can send a report to help us find the cause. Nothing is sent unless you choose Send Report.</p>
        <label for="runtime-error-title">Report title</label>
        <input data-runtime-error-title id="runtime-error-title" type="text" maxlength="200">
        <label for="runtime-error-message">What happened?</label>
        <textarea data-runtime-error-message id="runtime-error-message" maxlength="4000" rows="7"></textarea>
        <p data-runtime-error-status class="runtime-error-status" role="status" aria-live="polite"></p>
        <div class="runtime-error-actions">
          <button data-runtime-error-dismiss class="action-btn" type="button">Not now</button>
          <button data-runtime-error-send class="action-btn" type="button">Send Report</button>
        </div>
      </div>
    </dialog>
    <script>
      window.__earlyErrorCapture = (() => {
        const save = (type, error) => {
          if (!window.desktopApi?.recordRuntimeError) return;
          const record = {
            type,
            message: error?.message ?? String(error ?? "Unknown error"),
            filename: error?.filename,
            line: error?.lineno,
            column: error?.colno,
            stack: error?.error?.stack ?? error?.reason?.stack,
          };
          Promise.resolve().then(() => window.desktopApi.recordRuntimeError(record))
            .catch((saveError) => console.error("Could not save startup error:", saveError));
        };
        // A file that fails to load (script, image, stylesheet) sends a plain event with no message.
        const handleError = (event) => {
          const target = event.target;
          if (target && target !== window && !(event instanceof ErrorEvent)) {
            const file = target.src || target.href || target.currentSrc || "unknown file";
            save("renderer-error", { message: `Could not load ${String(target.tagName).toLowerCase()} ${file}` });
            return;
          }
          save("renderer-error", event);
        };
        const handleRejection = (event) => save("unhandled-rejection", event);
        window.addEventListener("error", handleError, true);
        window.addEventListener("unhandledrejection", handleRejection);
        return () => {
          window.removeEventListener("error", handleError, true);
          window.removeEventListener("unhandledrejection", handleRejection);
        };
      })();
    </script>
    <script type="module" src="/js/scenes/main.js"></script>
  </body>
</html>
