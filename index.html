<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Arms Dealer UI Lab</title>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-layer">
        <div id="persistent-hud" class="hidden">
          <div class="hud-section">
            <button id="hud-main-menu-btn" class="hud-pause-btn" type="button"
              title="Leave this game and go back to the title screen">MAIN MENU</button>
            <button id="hud-debug-info-btn" class="hud-pause-btn" type="button"
              title="Save a screenshot and state report to a local debug session">Debug Info</button>
            <button id="hud-debug-shop-upgrade-btn" class="hud-pause-btn" type="button"
              title="Debug: open the next sales floor expansion for free">+Floor</button>
            <button id="hud-debug-backroom-upgrade-btn" class="hud-pause-btn" type="button"
              title="Debug: open the next backroom upgrade for free">+Backroom</button>
            <div class="hud-stat">
              <span class="hud-label">CREDITS</span>
              <span id="hud-credits" class="hud-value">0 credits</span>
            </div>
            <div class="hud-stat">
              <span class="hud-label">REPUTATION</span>
              <span id="hud-rep" class="hud-value rep">0</span>
            </div>
            <div class="hud-stat">
              <span class="hud-label">SHOP LEVEL</span>
              <span id="hud-shop-level" class="hud-value rep">1</span>
            </div>
            <div class="hud-stat">
              <span class="hud-label">HOVERCART</span>
              <span id="hud-hovercart" class="hud-value">0/15</span>
            </div>
            <div id="hud-stamina" class="hud-stat hud-stamina" role="progressbar"
              aria-label="Player stamina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"
              title="Hold Shift while moving to dash. Stamina recovers while walking or resting. When empty, recover to 25% before dashing again.">
              <span class="hud-label">STAMINA</span>
              <div class="hud-stamina-track"><div id="hud-stamina-fill" class="hud-stamina-fill"></div></div>
              <span id="hud-stamina-value" class="hud-value time">100%</span>
            </div>
          </div>
          <div class="hud-section">
            <button id="hud-save-btn" class="hud-pause-btn" type="button" disabled
              title="Save while the store is closed">SAVE</button>
            <div class="hud-stat">
              <span class="hud-label">SHIFT</span>
              <span id="hud-shift-time" class="hud-value time">08:00</span>
            </div>
            <button id="hud-pause-btn" class="hud-pause-btn" data-pad-autofocus aria-label="Pause/resume shift clock">
              PAUSE
            </button>
            <button id="hud-store-toggle-btn" class="hud-pause-btn hidden" type="button"
              aria-pressed="false"
              title="Temporarily stop new customers. Customers already inside can finish shopping, and the shift clock keeps running.">
              CLOSE STORE
            </button>
            <button id="hud-start-shift-btn" class="hud-start-shift-btn hidden" data-pad-autofocus aria-label="Start shift">
              START SHIFT
            </button>
            <button id="hud-end-day-btn" class="hud-end-day-btn hidden" data-pad-autofocus type="button"
              title="The shift is over. Open Finances to see today's receipt and end the day.">
              END DAY
            </button>
          </div>
          <div id="debug-feedback" class="hud-debug-feedback hidden">
            <span id="debug-status" role="status" aria-live="polite"></span>
            <button id="debug-folder-btn" class="hud-pause-btn hidden" type="button">OPEN FOLDER</button>
          </div>
        </div>
        <div id="game-message" class="game-message hidden" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
    </div>
    <script type="module" src="/js/scenes/main.js"></script>
  </body>
</html>
