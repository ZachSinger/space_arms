<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Arms Dealer UI Lab</title>
  </head>
  <body>
    <div id="game-container">
      <div id="ui-layer">
        <div id="persistent-hud" class="hidden">
          <div class="hud-section">
            <div class="hud-stat">
              <span class="hud-label">CREDITS</span>
              <span id="hud-credits" class="hud-value">0c</span>
            </div>
            <div class="hud-stat">
              <span class="hud-label">REPUTATION</span>
              <span id="hud-rep" class="hud-value rep">0</span>
            </div>
            <div class="hud-stat">
              <span class="hud-label">HOVERCART</span>
              <span id="hud-hovercart" class="hud-value">0/10</span>
            </div>
          </div>
          <div class="hud-section">
            <div class="hud-stat">
              <span class="hud-label">SHIFT</span>
              <span id="hud-shift-time" class="hud-value time">08:00</span>
            </div>
            <button id="hud-pause-btn" class="hud-pause-btn" aria-label="Pause/resume shift clock">
              PAUSE
            </button>
            <button id="hud-start-shift-btn" class="hud-start-shift-btn hidden" aria-label="Start shift">
              START SHIFT
            </button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/js/scenes/main.js"></script>
  </body>
</html>
